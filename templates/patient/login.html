{% extends "base.html" %}
{% block title %}Patient Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card p-8">
    <h1 class="text-2xl font-bold text-teal-800 mb-6">Patient Login</h1>
    <form method="post" action="{{ url_for('patient_login') }}">
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" name="email" required class="input w-full mb-4" placeholder="your@email.com">
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required class="input w-full mb-4" placeholder="••••••••">
        <button type="submit" class="btn-primary w-full">Login</button>
    </form>
    <p class="mt-4 text-center text-slate-600 text-sm">Don't have an account? <a href="{{ url_for('patient_register') }}" class="text-teal-600 font-medium">Register</a></p>
</div>
{% endblock %}
