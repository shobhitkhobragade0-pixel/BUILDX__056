{% extends "base.html" %}
{% block title %}Blood Donors{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-teal-800 mb-2">Blood Donor Search</h1>
    <p class="text-slate-600 mb-6">Search by blood group, location, and availability.</p>

    <div class="card p-6 mb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Blood group</label>
                <select id="donor-blood" class="input w-full">
                    <option value="">Any</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Location</label>
                <input type="text" id="donor-location" class="input w-full" placeholder="City or area">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Available only</label>
                <select id="donor-available" class="input w-full">
                    <option value="">All</option>
                    <option value="1">Yes</option>
                </select>
            </div>
            <div class="flex items-end">
                <button type="button" id="donor-search" class="btn-primary w-full">Search</button>
            </div>
        </div>
    </div>

    <div id="donors-list" class="space-y-3"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/blood_donors.js') }}"></script>
{% endblock %}
