{% extends "base.html" %}
{% block title %}Health ID{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-teal-800 mb-6">Health ID & Records</h1>

    <div class="card p-6 mb-8">
        <h2 class="text-lg font-semibold text-teal-800 mb-4">Link Health ID</h2>
        <div class="flex gap-4 items-end">
            <div class="flex-1">
                <label class="block text-sm font-medium text-slate-700 mb-1">Health ID (e.g. ABDM)</label>
                <input type="text" id="health-id-input" class="input w-full" placeholder="Your Health ID">
            </div>
            <button type="button" id="health-id-save" class="btn-primary">Save</button>
        </div>
        <p id="health-id-status" class="mt-2 text-sm text-slate-600"></p>
    </div>

    <div class="card p-6">
        <h2 class="text-lg font-semibold text-teal-800 mb-4">Visit history & records</h2>
        <div id="health-records-list" class="space-y-3"></div>
        <p id="no-records" class="text-slate-600 hidden">No records yet.</p>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/health_id.js') }}"></script>
{% endblock %}
