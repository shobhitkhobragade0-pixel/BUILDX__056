{% extends "base.html" %}
{% block title %}Book Appointment{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-teal-800 mb-6">Book Appointment</h1>
    <p class="text-slate-600 mb-6">Please <a href="{{ url_for('patient_login') }}" class="text-teal-600 font-medium">login</a> or <a href="{{ url_for('patient_register') }}" class="text-teal-600 font-medium">register</a> to book.</p>

    <div id="booking-flow" class="card p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Department</label>
                <select id="book-department" class="input w-full mb-4">
                    <option value="">Select department</option>
                </select>
                <label class="block text-sm font-medium text-slate-700 mb-1">Doctor</label>
                <select id="book-doctor" class="input w-full mb-4">
                    <option value="">Select doctor</option>
                </select>
            </div>
            <div>
                <p id="doctor-queue" class="text-sm text-slate-600 mb-2"></p>
                <label class="block text-sm font-medium text-slate-700 mb-1">Date</label>
                <select id="book-date" class="input w-full mb-4">
                    <option value="">Select date</option>
                </select>
                <label class="block text-sm font-medium text-slate-700 mb-1">Time slot</label>
                <div id="book-slots" class="flex flex-wrap gap-2 mb-4"></div>
                <button type="button" id="book-submit" class="btn-primary" disabled>Book appointment</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/booking.js') }}"></script>
{% endblock %}
