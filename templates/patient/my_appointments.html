{% extends "base.html" %}
{% block title %}My Appointments{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-teal-800 mb-6">My Appointments</h1>
    <div id="appointments-list" class="space-y-4"></div>

{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/my_appointments.js') }}"></script>
{% endblock %}
