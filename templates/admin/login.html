{% extends "admin/base_admin.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card p-8">
    <h1 class="text-2xl font-bold text-amber-800 mb-6">Admin Login</h1>
    <form method="post" action="{{ url_for('admin_login') }}">
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" name="username" required class="input w-full mb-4" placeholder="admin">
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required class="input w-full mb-4" placeholder="••••••••">
        <button type="submit" class="w-full py-2 px-4 bg-amber-600 text-white rounded hover:bg-amber-700">Login</button>
    </form>
</div>
{% endblock %}
