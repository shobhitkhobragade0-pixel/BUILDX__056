<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} | Arogya Sampark</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <nav class="navbar bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-40">
        <div class="container mx-auto px-4">
            <div class="h-16 flex items-center justify-between">
                <a href="{{ url_for('admin_dashboard') }}" class="font-extrabold text-slate-900 text-lg flex items-center gap-2">
                    <span class="text-2xl text-emerald-600" aria-hidden="true">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 13c0 5-3.5 7.5-8 9-4.5-1.5-8-4-8-9V6l8-4 8 4z" />
                            <path d="M12 8v4" />
                            <path d="M12 16h.01" />
                        </svg>
                    </span>
                    Arogya Sampark <span class="text-slate-400 font-semibold">Admin</span>
                </a>
                {% if session.get('admin_logged_in') %}
                    <div class="hidden md:flex items-center gap-2">
                        <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-link inline-flex items-center gap-2">
                            <span class="text-blue-600" aria-hidden="true">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="3" width="7" height="7" />
                                    <rect x="14" y="3" width="7" height="7" />
                                    <rect x="14" y="14" width="7" height="7" />
                                    <rect x="3" y="14" width="7" height="7" />
                                </svg>
                            </span>
                            Dashboard
                        </a>
                        <button type="button" class="admin-nav-link inline-flex items-center gap-2" data-tab="emergencies">
                            <span class="text-red-600" aria-hidden="true">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                                    <path d="M12 9v4" />
                                    <path d="M12 17h.01" />
                                </svg>
                            </span>
                            Emergency Alerts
                        </button>
                        <button type="button" class="admin-nav-link inline-flex items-center gap-2" data-tab="doctors">
                            <span class="text-teal-700" aria-hidden="true">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                            </span>
                            Doctors
                        </button>
                        <button type="button" class="admin-nav-link inline-flex items-center gap-2" data-tab="appointments">
                            <span class="text-blue-600" aria-hidden="true">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                    <path d="M16 2v4" />
                                    <path d="M8 2v4" />
                                    <path d="M3 10h18" />
                                </svg>
                            </span>
                            Appointments
                        </button>
                        <button type="button" class="admin-nav-link inline-flex items-center gap-2" data-tab="patients">
                            <span class="text-emerald-600" aria-hidden="true">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                    <circle cx="12" cy="7" r="4" />
                                </svg>
                            </span>
                            Patients
                        </button>
                        <button type="button" class="admin-nav-link inline-flex items-center gap-2" data-tab="donors">
                            <span class="text-red-600" aria-hidden="true">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 2s7 7.2 7 13a7 7 0 0 1-14 0c0-5.8 7-13 7-13z" />
                                </svg>
                            </span>
                            Donors
                        </button>
                        <a href="{{ url_for('admin_logout') }}" class="admin-nav-link text-red-600">Logout</a>
                    </div>
                {% else %}
                    <div class="hidden md:flex items-center gap-2">
                        <span class="text-slate-500 text-sm">Admin Access</span>
                    </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-slate-200 py-4 mt-8 text-center text-slate-600 text-sm">
        &copy; Arogya Sampark Admin Console
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
